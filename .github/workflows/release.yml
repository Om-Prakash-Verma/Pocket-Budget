name: GhostPocket Release Workflow

on:
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Target Semantic Version (e.g. 2.0.1, 2.1.0, 3.0.0)'
        required: true
        type: string
      publish_release:
        description: 'Publish release to GitHub? (Set true to publish)'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  validate-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Validate Semantic Version & Duplicate Tag Check
        id: semver
        run: |
          TARGET="${{ inputs.target_version }}"
          echo "Target version: $TARGET"
          
          # Regex check
          if [[ ! "$TARGET" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Target version $TARGET does not match Semantic Versioning (MAJOR.MINOR.PATCH)"
            exit 1
          fi
          
          # Check if tag already exists
          TAG="v$TARGET"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists!"
            exit 1
          fi
          
          # Read current version
          CURRENT_VERSION=$(grep 'versionName =' app/build.gradle.kts | head -n 1 | tr -d '" ' | cut -d'=' -f2)
          CURRENT_CODE=$(grep 'versionCode =' app/build.gradle.kts | head -n 1 | tr -d ' ' | cut -d'=' -f2)
          NEXT_CODE=$((CURRENT_CODE + 1))
          
          echo "Current: $CURRENT_VERSION ($CURRENT_CODE) -> Next: $TARGET ($NEXT_CODE)"
          echo "target_tag=$TAG" >> $GITHUB_OUTPUT
          echo "target_version=$TARGET" >> $GITHUB_OUTPUT
          echo "next_code=$NEXT_CODE" >> $GITHUB_OUTPUT

      - name: Update Version in Android Project
        run: |
          TARGET="${{ steps.semver.outputs.target_version }}"
          NEXT_CODE="${{ steps.semver.outputs.next_code }}"
          
          sed -i "s/versionCode = [0-9]\+/versionCode = $NEXT_CODE/g" app/build.gradle.kts
          sed -i "s/versionName = \"[0-9]\+\.[0-9]\+\.[0-9]\+\"/versionName = \"$TARGET\"/g" app/build.gradle.kts
          
          sed -i "s/currentVersionName: String = \"[0-9]\+\.[0-9]\+\.[0-9]\+\"/currentVersionName: String = \"$TARGET\"/g" app/src/main/java/com/ghostpocket/app/ui/screens/SettingsScreen.kt
          sed -i "s/currentVersionCode: Int = [0-9]\+/currentVersionCode: Int = $NEXT_CODE/g" app/src/main/java/com/ghostpocket/app/ui/screens/SettingsScreen.kt
          
          sed -i "s/Pair(\"[0-9]\+\.[0-9]\+\.[0-9]\+\", [0-9]\+)/Pair(\"$TARGET\", $NEXT_CODE)/g" app/src/main/java/com/ghostpocket/app/viewmodel/GhostPocketViewModel.kt

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify and Extract Artifact
        id: apk
        run: |
          TARGET="${{ steps.semver.outputs.target_version }}"
          APK_PATH="app/build/outputs/apk/debug/GhostPocket-v${TARGET}.apk"
          if [ ! -f "$APK_PATH" ]; then
            # Check fallback
            FALLBACK=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
            if [ -n "$FALLBACK" ]; then
              cp "$FALLBACK" "$APK_PATH"
            else
              echo "::error::APK was not found after build!"
              exit 1
            fi
          fi
          
          SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "Built APK: $APK_PATH (SHA-256: $SHA256)"

      - name: Extract Changelog Section
        id: notes
        run: |
          TARGET="${{ steps.semver.outputs.target_version }}"
          NEXT_CODE="${{ steps.semver.outputs.next_code }}"
          NOTES_FILE="release_notes_${TARGET}.md"
          
          # Extract section from CHANGELOG.md if present
          if [ -f "CHANGELOG.md" ]; then
            awk -v ver="[$TARGET]" '
              $0 ~ "## "ver {flag=1; print; next}
              $0 ~ "## \\[[0-9]" {flag=0}
              flag {print}
            ' CHANGELOG.md > "$NOTES_FILE"
          fi
          
          if [ ! -s "$NOTES_FILE" ]; then
            cat <<EOF > "$NOTES_FILE"
          ### GhostPocket v${TARGET}

          - **versionCode**: ${NEXT_CODE}
          - **SHA-256**: \`${{ steps.apk.outputs.sha256 }}\`
          EOF
          fi
          
          echo "notes_file=$NOTES_FILE" >> $GITHUB_OUTPUT

      - name: Create Git Tag and GitHub Release
        if: ${{ inputs.publish_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          name: "GhostPocket v${{ steps.semver.outputs.target_version }} 🚀"
          tag_name: ${{ steps.semver.outputs.target_tag }}
          draft: false
          prerelease: false
          body_path: ${{ steps.notes.outputs.notes_file }}
          files: ${{ steps.apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
