name: Release GhostPocket APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Tag (e.g. v1.4.1)'
        required: true
        default: 'v1.4.1'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare Release Assets & Checksum
        id: prepare_assets
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK not found!"
            exit 1
          fi
          APK_NAME=$(basename "$APK_PATH")
          echo "Found APK: $APK_NAME at $APK_PATH"
          
          # Calculate SHA-256 Checksum
          SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')
          echo "SHA256: $SHA256"
          echo "$SHA256  $APK_NAME" > "${APK_PATH}.sha256"
          
          # Extract Version Info from build.gradle.kts
          VERSION_CODE=$(grep 'versionCode =' app/build.gradle.kts | head -n 1 | awk '{print $3}')
          VERSION_NAME=$(grep 'versionName =' app/build.gradle.kts | head -n 1 | tr -d '"' | awk '{print $3}')
          
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT
          echo "sha256_path=${APK_PATH}.sha256" >> $GITHUB_OUTPUT
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "GhostPocket ${{ steps.prepare_assets.outputs.version_name }} 👻"
          tag_name: ${{ github.ref_name || inputs.version_tag }}
          draft: false
          prerelease: false
          body: |
            ## GhostPocket v${{ steps.prepare_assets.outputs.version_name }} 🚀👻
            
            ### Release Information
            - **Version Name:** `${{ steps.prepare_assets.outputs.version_name }}`
            - **versionCode:** `${{ steps.prepare_assets.outputs.version_code }}`
            - **SHA-256:** `${{ steps.prepare_assets.outputs.sha256 }}`
            
            ### What's New
            - In-app automatic update delivery via GitHub Releases.
            - All-time Net Balance calculation independent of selected historical months.
            - Flexible realm/category selection (note is optional when realm is chosen; note is mandatory when uncategorized).
            
            ### Verification
            Verify your APK using:
            ```bash
            sha256sum ${{ steps.prepare_assets.outputs.apk_name }}
            ```
          files: |
            ${{ steps.prepare_assets.outputs.apk_path }}
            ${{ steps.prepare_assets.outputs.sha256_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
